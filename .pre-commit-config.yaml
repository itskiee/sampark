# Checks that run automatically before every `git commit` (install once: `pre-commit install`).
# Remote hooks are pinned to exact commit SHAs (`pre-commit autoupdate --freeze`), so a moved
# tag upstream cannot change what runs on this machine.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1 (same version as CI)
    hooks:
      - id: gitleaks            # blocks commits containing API keys, tokens, private keys

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files   # stops accidental commits of rasters / data dumps
        args: ["--maxkb=1024"]
        # Two intentional exceptions: our trained segmentation model (1.9 MB ONNX) and the
        # report PDF (a deliverable); the model must ship so the pipeline runs. Exact paths only.
        exclude: ^(models/segmentation/s1_water_unet\.onnx|report/Sampark_report\.pdf)$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Local hooks use the versions pinned in requirements-dev.txt (same as CI).
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + security rules)
        entry: ruff check
        language: system
        types: [python]
      - id: data-rules
        name: data rules (disqualification guard)
        entry: python -m pytest -q -p no:cacheprovider tests/test_data_rules.py
        language: system
        pass_filenames: false
        always_run: true
