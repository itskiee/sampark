# Continuous integration: lint, offline tests (incl. data-rules guard), secret scan,
# dependency vulnerability audit.
#
# Security posture:
# - read-only token (`contents: read`), no repository secrets are used or needed;
# - third-party actions pinned to full commit SHAs (a moved tag cannot change them);
# - checkout does not persist credentials; no pull_request_target; GitHub-hosted runners only;
# - the gitleaks binary is verified against a pinned SHA-256 before it runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install (hash-verified)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint (ruff incl. security rules)
        run: ruff check .
      - name: Offline tests (data rules, redaction, AOI, pipeline, CLI)
        run: python -m pytest

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not only the last commit
          persist-credentials: false
      - name: Download and verify gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          pip-audit --strict --disable-pip -r requirements.txt
          pip-audit --strict --disable-pip -r requirements-dev.txt
