# Default pipeline configuration — the single source of truth for every tunable value.
# Event files (configs/events/*.yaml) may override any key under `config_overrides:`.
# Every value has a comment saying WHY it has that value; keep it that way.

limits:
  # Largest area we accept. Bounds download size/time from Copernicus Data Space and ohsome
  # so a live run cannot hang; ~2,500 km² covers a 50 km valley reach with margin
  # (the Trishuli corridor box is ~1,800 km²). Larger areas get a clear error message.
  max_aoi_km2: 2500
  # Smallest area we accept: below ~0.5 km² there are too few pixels for statistics
  # (e.g. Otsu thresholds) to be meaningful.
  min_aoi_km2: 0.5

cache:
  # Cache intermediate results so re-runs (and the live demo) are fast. Keys include
  # AOI hash + date + stage config + pipeline version, so changed settings never reuse
  # stale results.
  enabled: true
  dir: cache            # relative to the repository root, git-ignored

output:
  dir: outputs          # per-run folders with maps, PNGs and results.json, git-ignored

logging:
  dir: logs             # full (redacted) log with tracebacks, git-ignored
  level: INFO           # console verbosity

s1:
  # --- Pairing (which before/after images to compare) -------------------------------
  # Look back this far for pre-event images. 36 days = three 12-day repeats of one
  # satellite on the same track, so we normally get up to 3 pre-event images.
  pre_window_days: 36
  # Look ahead this far for the first post-event image. 24 days = two repeats, so a
  # track that missed one pass still qualifies; the earliest post image is chosen.
  post_window_days: 24
  # Up to this many pre-event images are combined (per-pixel median) into a cleaner
  # reference: the median suppresses speckle and one-off effects (rain, wet snow).
  max_pre_images: 3
  # Minimum fraction of the area an image must cover to be used.
  min_coverage: 0.5
  # An image taken ON the event date may be from before the flood, so by default it is
  # used neither as "before" nor as "after". Set true to allow it as "after".
  include_event_day_as_post: false
  # Images of one pass are split into ~25 s slices; slices of the same track closer than
  # this are merged into one acquisition.
  same_pass_minutes: 10

  # --- Processing ---------------------------------------------------------------------
  # Output pixel size. Sentinel-1 IW GRD has ~20 m true resolution (10 m pixels are
  # oversampled), so 20 m loses little detail and quarters the data volume.
  resolution_m: 20
  # Larger areas are processed at a coarser pixel size so one image stays below this
  # many pixels (bounds download size/time on Copernicus Data Space).
  max_pixels: 16000000
  # Speckle filter: median over a square window of this many pixels (3 = 60 m at 20 m).
  # Small on purpose: rivers here are only 50-150 m wide and larger windows blur them.
  speckle_window_px: 3
  # Backscatter below this (dB) is treated as no-data (image borders, radar shadow).
  min_valid_db: -30.0
  # Seconds to wait for one synchronous openEO request before switching to a batch job.
  sync_timeout_s: 600

  # --- Change classification ----------------------------------------------------------
  # "fixed": thresholds below. "otsu": data-driven thresholds per tail, sanity-checked,
  # falling back to the fixed values if the histogram is not clearly bimodal.
  threshold_method: fixed
  # Log-ratio = 10*log10(after/before). -3 dB = backscatter halved; +3 dB = doubled.
  # A factor-2 change is far above speckle noise after filtering, a common conservative
  # choice for SAR change detection.
  decrease_db: -3.0
  increase_db: 3.0
  # New water must also be DARK after the event (smooth water reflects radar away).
  water_post_vv_db: -15.0
  # Otsu thresholds outside these bounds are rejected (fallback to fixed values).
  otsu_decrease_bounds_db: [-10.0, -1.5]
  otsu_increase_bounds_db: [1.5, 10.0]
  # Minimum between-class variance ratio for a histogram tail to count as bimodal.
  otsu_min_separability: 0.5
  # Changed patches smaller than this are removed as noise (2,000 m² = 5 pixels at 20 m).
  min_mapping_unit_m2: 2000
  # Process the best pair AND the best pair from the opposite pass direction (ascending vs
  # descending). The two look at the valley from opposite sides, so one sees what the
  # other has in radar shadow/layover, and agreement between them raises confidence.
  # 1 = only the best track (faster).
  max_tracks: 2

terrain:
  # Copernicus DEM GLO-30 is processed at its native 30 m resolution.
  dem_resolution_m: 30
  # The DEM is fetched for the area plus this margin, so streams entering the area have
  # some upstream catchment (otherwise their flow accumulation is cut off at the border).
  buffer_m: 10000
  # A cell is a "stream" when at least this much area drains through it. 5 km² keeps
  # rivers and larger torrents; smaller values would turn every gully into a "river".
  stream_area_km2: 5
  # Plausible flood/debris zone: at most this high above the nearest stream. Glacial lake
  # outburst / debris floods in gorges reach 10–20 m depth and deposit on terraces, so
  # 30 m is generous; normal river floods would use ~10–15 m.
  hand_max_m: 30
  # ...and not steeper than this (water does not stand and thick deposits do not stay on
  # steeper slopes; 30 m DEM slopes are smoothed, so the limit is set conservatively).
  slope_max_deg: 30
  # Permanent (pre-event) water: dark in the BEFORE images (open water is typically below
  # about -18 dB in VV and -24 dB in VH) and inside the plausible zone. Shown separately so
  # the normal river is not reported as "flooded".
  permanent_water_vv_db: -18.0
  permanent_water_vh_db: -24.0

s2:
  # Optical images are only useful when the sky is clear (often not in the monsoon).
  pre_window_days: 60      # look this far back for a clear "before" image
  post_window_days: 30     # and this far ahead for the first clear "after" image
  # Skip catalogue scenes whose tile is cloudier than this (tile-level estimate).
  max_tile_cloud_pct: 70
  # After cloud masking (SCL band), at least this share of the area must be clear in BOTH
  # images, otherwise the stage reports "too cloudy" and the pipeline continues without it.
  min_clear_share: 0.10
  # MNDWI = (green - SWIR) / (green + SWIR) > 0 is the standard open-water test.
  water_mndwi: 0.0
  # Mud/debris: vegetation removed (NDVI drop of at least this much) and little vegetation
  # left afterwards.
  ndvi_drop: 0.25
  ndvi_post_max: 0.35

confidence:
  # Sources are compared within a small neighbourhood (1 pixel = 20 m) so that a tiny
  # misregistration between tracks does not count as disagreement.
  neighbourhood_px: 1
  # A single-source detection counts as "medium" (not "low") when its patch is at least
  # this large: coherent deposits are larger than residual speckle.
  medium_min_patch_m2: 5000

flood_path:
  # A start point near (not exactly on) the river is moved to the channel within this radius.
  snap_radius_m: 300
  # Settlements within this distance of the traced path are listed as "along the path" (M3).
  settlement_buffer_m: 1000
  # P19: an affected asset within this distance of the traced path is tagged "on the flood
  # corridor" (damage most likely from THIS event), others "elsewhere" (other rivers, fields).
  corridor_buffer_m: 1000

osm:
  # Roads, places and health facilities are fetched for the area PLUS this margin: the
  # nearest town or hospital may lie outside the area, and roads leaving the area must not
  # look like dead ends (cut-off analysis, M4). Buildings are fetched for the area only.
  network_buffer_m: 10000
  # Length of the OSM full-history window that ends at the snapshot. Only versions still
  # valid at the snapshot are kept; a short window keeps the download small.
  history_window_hours: 24
  # Large areas are split into tiles of at most this size. Each ohsome request has a fixed
  # cost of ~15-35 s, so FEWER requests are faster (measured 2026-10-12, Trishuli: points of
  # interest 10 tiles 6.4 min vs 1 request 16 s; roads 43 s vs 11 s; same counts). Dense
  # buildings use medium tiles so one response never gets huge (107k buildings: 2 tiles 54 s,
  # 5 tiles ~5 min). Sparse layers (roads, places, health facilities) use one request.
  max_tile_km2_buildings: 1000
  max_tile_km2_sparse: 10000
  # Per-request timeout for ohsome feature downloads (large tiles take minutes).
  timeout_s: 300
  # OSM names are untrusted text: longer values are cut (display + language model safety).
  max_text_length: 80
  # Buildings are assigned to the nearest named place within this distance; the count is
  # the brief's population proxy. 1 km covers a Himalayan village with its scattered houses.
  settlement_radius_m: 1000
  # P18 settlements = groups of buildings, each building within this distance of the next.
  # Measured on Trishuli (2026-10-12): 75 m → 2,848 groups covering 91 % of buildings, the
  # largest 2.9 km across (a town); 150 m chains whole hillsides into 12 km blobs.
  settlement_link_m: 75
  # Smaller groups are isolated houses (still counted in totals, not listed as settlements).
  settlement_min_buildings: 5
  # Safety: a group wider than this is split on a grid of half this size.
  settlement_max_extent_m: 3000
  # Naming: the group nearest to a named OSM place within `settlement_radius_m` takes its
  # name; other groups within this distance are "near <place>"; the rest get coordinates.
  settlement_near_radius_m: 3000
  # "Road connection" for the cut-off analysis: OSM highway types a 4x4/truck can use.
  # `track` is included: many hill villages are reached only by unpaved tracks.
  # Footpaths/steps are kept in the data (the "all ways" variant in M4).
  motorable_highways: [motorway, motorway_link, trunk, trunk_link, primary, primary_link,
                       secondary, secondary_link, tertiary, tertiary_link, unclassified,
                       residential, living_street, service, road, track]

damage:
  # Buffers tolerate the 20 m radar pixel and small OSM/satellite misregistration.
  building_buffer_m: 10
  road_buffer_m: 10
  facility_buffer_m: 20
  # Bridge logic (P8): flood/debris touching the deck or its approaches ...
  bridge_approach_m: 30
  # ... or a changed river reach just up/downstream (the channel itself was already water).
  bridge_reach_m: 150
  # How many entries the results.json keeps per list (full lists are in the GeoJSON files).
  max_listed: 25

cutoff:
  # A road piece/bridge counts as BROKEN only when the flood/debris touching it has at
  # least this confidence. The no-flood control run (M3) showed low-confidence specks near
  # 9 bridges; breaking roads on them would raise false "cut off" alarms. Low-confidence
  # breaks are still reported as a worst case ("possibly cut off").
  break_min_confidence: medium
  # Settlements, hospitals and towns are joined to the nearest road node within this
  # distance; farther away = "no road access" (e.g. trail-only villages).
  snap_max_m: 500
  # Roads are split into pieces of at most this length before building the graph, so a
  # settlement can join a long straight road anywhere (OSM vertices can be ~1 km apart) and
  # breaks are located to within this distance.
  densify_m: 50
  # Road nodes outside the downloaded network area (shrunk by this margin) count as
  # "outside": the road continues to the wider network, so it is not a dead end (P9).
  boundary_margin_m: 200
  # Place types that count as a "town" (brief: "nearest town or hospital").
  town_places: [town, city]
  # A route that still exists but became much longer is a "detour" when at least this many
  # times longer AND at least `detour_min_extra_km` longer.
  detour_factor: 1.5
  detour_min_extra_km: 2.0
  max_listed: 25

landing_zones:
  # Helicopter landing-zone CANDIDATES (M8 extra). Conservative "near-level ground" limit on
  # the 30 m Copernicus DEM; steeper spots are excluded. Real suitability is checked on site.
  max_slope_deg: 6
  # A clear square of at least this side must fit (room for rotor clearance and touchdown).
  min_clear_square_m: 60
  # Keep this far from mapped (pre-event OSM) buildings.
  clear_of_buildings_m: 30
  # Only candidates a person can reach on foot from the settlement (straight-line distance).
  max_distance_m: 3000
  # Options listed per settlement (walks that avoid detected flood/debris come first).
  per_settlement: 2

multidate:
  # Later Sentinel-1 passes of the same track are tracked up to this many days after the event
  # (12-day repeat: about three passes; more if Sentinel-1C/1D add 6-day revisits).
  max_days_after_event: 40
  # At most this many later passes (each is one download from Copernicus Data Space).
  max_dates: 3
  # A water body on the last date is flagged as a POSSIBLE lake forming when it is at least
  # this large and at least `lake_growth_factor` times its area on the first date.
  lake_min_area_m2: 20000
  lake_growth_factor: 1.5
  # ...and it must be seen on at least this many later dates: water that appears on one image
  # only is usually wet snow or noise (both look dark like water to radar). With fewer later
  # passes available, all of them are required.
  lake_min_later_dates: 2

network:
  # Per-request timeout for catalogue / ohsome HTTP calls. ohsome's own server timeout is
  # 600 s; we stop earlier so a stuck request cannot freeze a live demo.
  timeout_s: 120
  # Retries with backoff for transient network errors (HTTP 429/5xx, timeouts).
  retries: 3
